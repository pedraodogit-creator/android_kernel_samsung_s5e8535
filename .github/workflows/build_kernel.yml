name: Build Kernel for A14 5G (Exynos 1330)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential libelf-dev flex bison openssl libssl-dev
          sudo apt install -y gcc-aarch64-linux-gnu clang lld
          sudo apt install -y python3 pip3
          pip3 install --upgrade mkbootimg

      - name: Configure kernel (a14x_defconfig + Halium)
        run: |
          set -e
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- a14x_defconfig
          echo -e "\nCONFIG_ANDROID_BINDER_IPC=y\nCONFIG_ASHMEM=y\nCONFIG_ION=y\nCONFIG_ANDROID_BINDER_DEVICES=\"binder,hwbinder,vndbinder\"" >> .config
          scripts/config --disable CONFIG_DEBUG_INFO_BTF
          scripts/config --enable CONFIG_SECTION_MISMATCH_WARN_ONLY

      - name: Build kernel (using all cores)
        run: |
          set -e
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld KCFLAGS="-Wno-error"

      - name: Verify kernel image
        id: verify
        run: |
          if [ -f arch/arm64/boot/Image ]; then
            echo "✅ Kernel Image generated successfully!"
            echo "image_exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Kernel Image not found!"
            echo "image_exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload kernel Image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: arch/arm64/boot/Image

      - name: Download Halium ramdisk (multiple sources)
        id: ramdisk
        run: |
          set -e
          sources=(
            "https://raw.githubusercontent.com/Halium/ramdisk/v9/ramdisk.img"
            "https://gitlab.com/halium/ramdisk/-/raw/v9/ramdisk.img?inline=false"
          )
          
          ramdisk_found=false
          for url in "${sources[@]}"; do
            echo "Trying to download from: $url"
            if wget --timeout=10 --tries=2 "$url" -O ramdisk.img 2>/dev/null; then
              if [ -s ramdisk.img ]; then
                echo "✅ Ramdisk downloaded successfully from: $url"
                echo "ramdisk_ok=true" >> $GITHUB_OUTPUT
                ramdisk_found=true
                break
              fi
            fi
          done
          
          if [ "$ramdisk_found" = false ]; then
            echo "⚠️ Warning: No ramdisk could be downloaded from remote sources."
            echo "⚠️ Creating minimal ramdisk image locally..."
            echo "ramdisk_ok=false" >> $GITHUB_OUTPUT
            
            # Create a minimal working ramdisk
            mkdir -p ramdisk_tmp
            cd ramdisk_tmp
            mkdir -p dev proc sys
            find . -print0 | cpio -0oH newc | gzip > ../ramdisk.img
            cd ..
            rm -rf ramdisk_tmp
            
            echo "✅ Minimal ramdisk created (device may need additional configuration)"
          fi

      - name: Generate halium-boot.img
        run: |
          set -e
          
          if [ ! -f arch/arm64/boot/Image ]; then
            echo "❌ Kernel Image not found!"
            exit 1
          fi
          
          if [ ! -f ramdisk.img ]; then
            echo "❌ Ramdisk not found!"
            exit 1
          fi
          
          echo "🔨 Generating halium-boot.img..."
          
          # Try to use DTB if available
          dtb_file=$(find arch/arm64/boot/dts -name "exynos1330*.dtb" 2>/dev/null | head -1)
          
          if [ -n "$dtb_file" ] && [ -f "$dtb_file" ]; then
            echo "✅ Found DTB: $dtb_file"
            mkbootimg --kernel arch/arm64/boot/Image \
                      --ramdisk ramdisk.img \
                      --dtb "$dtb_file" \
                      --out halium-boot.img
          else
            echo "⚠️ DTB not found, generating boot.img without DTB"
            mkbootimg --kernel arch/arm64/boot/Image \
                      --ramdisk ramdisk.img \
                      --out halium-boot.img
          fi
          
          if [ ! -f halium-boot.img ] || [ ! -s halium-boot.img ]; then
            echo "❌ Failed to generate halium-boot.img"
            exit 1
          fi
          
          echo "✅ halium-boot.img generated successfully!"
          ls -lh halium-boot.img

      - name: Upload halium-boot.img as artifact
        uses: actions/upload-artifact@v4
        with:
          name: halium-boot
          path: halium-boot.img
