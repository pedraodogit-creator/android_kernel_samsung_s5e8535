name: Build Kernel for A14 5G (Exynos 1330)

on:
  workflow_dispatch:
    inputs:
      allow_placeholder_ramdisk:
        description: "Build só do kernel, sem ramdisk Halium real (o boot.img gerado NÃO vai funcionar num aparelho)"
        type: boolean
        default: false

env:
  KERNEL_REPO: "https://github.com/devhunter1/android_kernel_samsung_s5e8535.git"
  KERNEL_BRANCH: "lineage-23.2"
  DEVICE_CODENAME: "a14x"
  CLANG_VERSION: "clang-r522817"
  # ATENÇÃO: este é o repo de exemplo do workflow original. O Halium não distribui
  # um ramdisk genérico pronto neste endereço – troque pelo ramdisk real do seu
  # dispositivo (gerado pelo build completo Halium/Android, ou extraído do
  # boot.img de fábrica). Veja o aviso na etapa "Download Halium ramdisk".
  HALIUM_RAMDISK_REPO: "https://gitlab.com/halium/ramdisk.git"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      # ============================================================
      # 1. INSTALAÇÃO DE DEPENDÊNCIAS
      # ============================================================
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt update
          sudo apt install --no-install-recommends -y \
            bc bison build-essential ccache curl device-tree-compiler \
            flex git gnupg gperf libxml2-utils \
            lzop pngcrush schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libssl-dev python3 python3-pip python-is-python3 libelf-dev cpio rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi

      # ============================================================
      # 2. SETUP DO CLANG (via Google)
      # ============================================================
      - name: Setup Clang
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/toolchain"
          cd "${{ github.workspace }}/toolchain"
          echo "📥 Baixando Clang (${{ env.CLANG_VERSION }})..."
          wget -q --show-progress "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${{ env.CLANG_VERSION }}.tar.gz" -O clang.tar.gz
          if [ ! -s clang.tar.gz ]; then
            echo "❌ Falha no download do Clang!"
            exit 1
          fi
          echo "📦 Extraindo Clang..."
          tar -xf clang.tar.gz
          if [ ! -d "bin" ]; then
            echo "❌ Diretório 'bin' não encontrado após extração!"
            exit 1
          fi
          chmod -R +x bin/
          echo "${{ github.workspace }}/toolchain/bin" >> "$GITHUB_PATH"
          echo "✅ Clang configurado com sucesso!"

      # ============================================================
      # 3. CLONE DO KERNEL
      # ============================================================
      - name: Clone kernel source
        run: |
          set -euo pipefail
          echo "📥 Clonando kernel (branch: ${{ env.KERNEL_BRANCH }})..."
          git clone --depth 1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_REPO }}" kernel
          cd kernel
          DEFCONFIG="arch/arm64/configs/${{ env.DEVICE_CODENAME }}_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            echo "❌ Defconfig não encontrado em: $DEFCONFIG"
            echo "📂 Conteúdo de arch/arm64/configs/:"
            ls -la arch/arm64/configs/ || true
            exit 1
          fi
          echo "✅ Defconfig encontrado: $DEFCONFIG"

      # ============================================================
      # 4. CONFIGURAÇÃO DO KERNEL (Halium + Correções + olddefconfig)
      # ============================================================
      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel
          DEFCONFIG="arch/arm64/configs/${{ env.DEVICE_CODENAME }}_defconfig"

          # Backup do original
          cp "$DEFCONFIG" "$DEFCONFIG.bak"

          # Adiciona opções do Halium
          echo -e "\nCONFIG_ANDROID_BINDER_IPC=y" >> "$DEFCONFIG"
          echo "CONFIG_ASHMEM=y" >> "$DEFCONFIG"
          echo "CONFIG_ION=y" >> "$DEFCONFIG"
          echo 'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"' >> "$DEFCONFIG"

          # Desabilita BTF (evita erro do pahole)
          sed -i 's/CONFIG_DEBUG_INFO_BTF=y/# CONFIG_DEBUG_INFO_BTF is not set/g' "$DEFCONFIG"

          # Transforma section mismatches em avisos
          echo "CONFIG_SECTION_MISMATCH_WARN_ONLY=y" >> "$DEFCONFIG"

          echo "✅ Configuração concluída (backup em $DEFCONFIG.bak)"

      # ============================================================
      # 5. COMPILAÇÃO DO KERNEL (toolchain completo + ccache + olddefconfig)
      # ============================================================
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.DEVICE_CODENAME }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.DEVICE_CODENAME }}-

      - name: Build kernel
        run: |
          set -euo pipefail
          cd kernel

          export PATH="${{ github.workspace }}/toolchain/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_MAXSIZE=5G

          if ! command -v clang &> /dev/null; then
            echo "❌ Clang não encontrado no PATH!"
            exit 1
          fi
          echo "🔧 Usando Clang: $(clang --version | head -n1)"

          # Array em vez de string: evita depender de word-splitting sem aspas
          MAKE_ARGS=(
            O=out
            ARCH=arm64
            CC="ccache clang"
            LLVM=1
            LLVM_IAS=1
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )

          echo "⚙️ Gerando .config..."
          make "${MAKE_ARGS[@]}" "${{ env.DEVICE_CODENAME }}_defconfig"

          echo "📄 Resolvendo opções de configuração pendentes (make olddefconfig)..."
          make "${MAKE_ARGS[@]}" olddefconfig

          echo "🛠️ Compilando kernel (usando todos os núcleos)..."
          make -j"$(nproc)" "${MAKE_ARGS[@]}" KCFLAGS="-Wno-error"
          ccache -s || true

          # Prioriza a Image "pura" (o DTB já é anexado à parte no mkbootimg);
          # só cai pro find genérico se nenhuma das opções conhecidas existir.
          IMG=""
          for candidate in Image Image.gz Image.gz-dtb Image-dtb; do
            if [ -f "out/arch/arm64/boot/$candidate" ]; then
              IMG="out/arch/arm64/boot/$candidate"
              break
            fi
          done
          if [ -z "$IMG" ]; then
            IMG=$(find out/arch/arm64/boot -maxdepth 1 -name "Image*" -type f | head -n 1)
          fi

          if [ -z "$IMG" ]; then
            echo "❌ Nenhuma imagem gerada em out/arch/arm64/boot/"
            echo "📂 Conteúdo de out/arch/arm64/boot/:"
            ls -la out/arch/arm64/boot/ || true
            exit 1
          fi

          echo "✅ Imagem encontrada em: $IMG"
          echo "IMAGE_PATH=${IMG}" >> "$GITHUB_ENV"

      # ============================================================
      # 6. UPLOAD DO KERNEL IMAGE (opcional)
      # ============================================================
      - name: Upload kernel Image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel/${{ env.IMAGE_PATH }}
          retention-days: 7

      # ============================================================
      # 7. CLONE DO MKBOOTIMG (repositório público – sem necessidade de token)
      # ============================================================
      - name: Clone mkbootimg
        run: |
          set -euo pipefail
          git clone https://github.com/osm0sis/mkbootimg.git

      - name: Build mkbootimg (remove -Werror)
        run: |
          set -euo pipefail
          cd mkbootimg
          sed -i 's/-Werror//g' Makefile
          sed -i 's/-Werror//g' libmincrypt/Makefile || true
          make
          cd ..
          if [ -f mkbootimg/mkbootimg ]; then
            echo "✅ mkbootimg compilado com sucesso"
          else
            echo "❌ Falha ao compilar mkbootimg"
            exit 1
          fi

      # ============================================================
      # 8. BAIXAR RAMDISK DO HALIUM (via Git)
      # ============================================================
      - name: Download Halium ramdisk
        run: |
          set -euo pipefail
          # O "git clone" fica DENTRO da condição do if: assim, se ele falhar,
          # o set -e não mata o script antes de chegarmos no fallback abaixo
          # (era esse o bug do workflow original).
          if git clone --depth 1 "${{ env.HALIUM_RAMDISK_REPO }}" halium-ramdisk && [ -f halium-ramdisk/ramdisk.img ]; then
            cp halium-ramdisk/ramdisk.img .
            echo "✅ Ramdisk baixado com sucesso"
          elif [ "${{ inputs.allow_placeholder_ramdisk }}" = "true" ]; then
            echo "⚠️ Ramdisk real não encontrado. Criando um vazio só para testar a compilação (build NÃO instalável)."
            touch ramdisk.img
          else
            echo "❌ Não foi possível obter um ramdisk Halium real de: ${{ env.HALIUM_RAMDISK_REPO }}"
            echo "   Esse endereço é só um placeholder do workflow original – troque HALIUM_RAMDISK_REPO"
            echo "   pelo ramdisk real do seu dispositivo (build completo Halium/Android, ou extraído do"
            echo "   boot.img de fábrica com o próprio mkbootimg/unpackbootimg)."
            echo "   Para compilar mesmo assim só para testar o kernel, rode este workflow com"
            echo "   'allow_placeholder_ramdisk: true'."
            exit 1
          fi

      # ============================================================
      # 9. GERAR HALIUM-BOOT.IMG (com DTB)
      # ============================================================
      - name: Generate halium-boot.img
        run: |
          set -euo pipefail
          KERNEL_IMAGE="${{ env.IMAGE_PATH }}"

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "❌ IMAGE_PATH não foi definida!"
            exit 1
          fi

          if [ ! -f "kernel/$KERNEL_IMAGE" ]; then
            echo "❌ Kernel Image não encontrado em: kernel/$KERNEL_IMAGE"
            exit 1
          fi

          # Encontrar DTB (ajuste o filtro do grep pro padrão real dos .dtb do seu kernel)
          DTB=$(find kernel/out/arch/arm64/boot/dts -name "*.dtb" 2>/dev/null | grep -E "exynos|s5e|a14" | head -1 || true)

          # Array em vez de string concatenada: evita quebrar se algum caminho tiver espaço
          MKBOOTIMG_ARGS=(--kernel "kernel/$KERNEL_IMAGE" --ramdisk ramdisk.img --output halium-boot.img)

          if [ -n "$DTB" ] && [ -f "$DTB" ]; then
            MKBOOTIMG_ARGS+=(--dtb "$DTB")
            echo "✅ Incluindo DTB: $DTB"
          else
            echo "⚠️ Nenhuma DTB encontrada. O boot pode não funcionar."
          fi

          # Use o mkbootimg compilado localmente, não o do sistema
          echo "🔧 Executando: ./mkbootimg/mkbootimg ${MKBOOTIMG_ARGS[*]}"
          ./mkbootimg/mkbootimg "${MKBOOTIMG_ARGS[@]}"

          if [ -f halium-boot.img ]; then
            echo "✅ halium-boot.img gerado com sucesso!"
            ls -lh halium-boot.img
          else
            echo "❌ Falha ao gerar halium-boot.img"
            exit 1
          fi

      # ============================================================
      # 10. UPLOAD DO HALIUM-BOOT.IMG
      # ============================================================
      - name: Upload halium-boot.img as artifact
        uses: actions/upload-artifact@v4
        with:
          name: halium-boot
          path: halium-boot.img
          retention-days: 7
