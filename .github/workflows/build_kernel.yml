name: Build Kernel for A14 5G (Exynos 1330)

on:
  workflow_dispatch:  # Permite iniciar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential libelf-dev flex bison openssl libssl-dev
          sudo apt install -y gcc-aarch64-linux-gnu clang lld

      - name: Configure kernel (a14x_defconfig + Halium)
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- a14x_defconfig
          echo -e "\nCONFIG_ANDROID_BINDER_IPC=y\nCONFIG_ASHMEM=y\nCONFIG_ION=y\nCONFIG_ANDROID_BINDER_DEVICES=\"binder,hwbinder,vndbinder\"" >> .config
          scripts/config --disable CONFIG_DEBUG_INFO_BTF
          scripts/config --enable CONFIG_SECTION_MISMATCH_WARN_ONLY

      - name: Build kernel (using all cores)
        run: |
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld KCFLAGS="-Wno-error"

      - name: Verify kernel image
        id: verify
        run: |
          if [ -f arch/arm64/boot/Image ]; then
            echo "✅ Kernel Image generated successfully!"
            echo "image_exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Kernel Image not found!"
            echo "image_exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload kernel Image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: arch/arm64/boot/Image

      - name: Try to download Halium ramdisk (multiple sources)
        id: ramdisk
        run: |
          # Tenta baixar de várias fontes até conseguir
          sources=(
            "https://raw.githubusercontent.com/Halium/ramdisk/v9/ramdisk.img"
            "https://gitlab.com/halium/ramdisk/-/raw/v9/ramdisk.img?inline=false"
            "https://dl.google.com/android/repository/ramdisk.img"  # Fallback AOSP
          )
          for url in "${sources[@]}"; do
            echo "Tentando baixar de: $url"
            if wget --timeout=10 --tries=3 "$url" -O ramdisk.img; then
              echo "✅ Ramdisk baixado com sucesso de: $url"
              echo "ramdisk_ok=true" >> $GITHUB_OUTPUT
              break
            fi
          done
          if [ ! -f ramdisk.img ]; then
            echo "⚠️ Nenhum ramdisk foi baixado. Criando um ramdisk vazio para teste."
            echo "ramdisk_ok=false" >> $GITHUB_OUTPUT
            # Cria um ramdisk vazio (não funcional, mas permite gerar o boot.img)
            echo "EMPTY RAMDISK" > ramdisk.img
          fi

      - name: Generate halium-boot.img
        run: |
          git clone https://github.com/osm0sis/mkbootimg
          chmod +x mkbootimg/mkbootimg
          if [ -f arch/arm64/boot/Image ]; then
            ./mkbootimg/mkbootimg --kernel arch/arm64/boot/Image --ramdisk ramdisk.img -o halium-boot.img
            echo "✅ halium-boot.img gerado com sucesso!"
          else
            echo "❌ Kernel Image não encontrado. Não foi possível gerar o boot.img."
            exit 1
          fi

      - name: Upload halium-boot.img as artifact
        uses: actions/upload-artifact@v4
        with:
          name: halium-boot
          path: halium-boot.img
