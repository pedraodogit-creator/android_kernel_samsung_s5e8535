name: Build Kernel Bandido (Snapdragon) with Ethernet

on:
  workflow_dispatch:

env:
  KERNEL_REPO: "https://github.com/bemerguy/bandido-sm8250.git"
  KERNEL_BRANCH: "bandido"
  DEVICE_CODENAME: "r8q"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Install build dependencies
        run: |
          sudo apt update
          # A flag --no-install-recommends impede que o apt puxe o gcc conflituoso
          sudo apt install --no-install-recommends -y \
            bc bison build-essential ccache curl device-tree-compiler \
            flex git gnupg gperf libxml2-utils \
            lzop pngcrush schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libssl-dev python3 python3-pip libelf-dev cpio \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Setup Clang
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          cd "$GITHUB_WORKSPACE/toolchain"
          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"
          wget -q "$CLANG_URL" -O clang.tar.gz
          # Extrai o conteúdo direto no diretório toolchain (remove nível topo)
          tar -xf clang.tar.gz --strip-components=1
          # Torna binários executáveis (agora bin/ existe aqui)
          chmod -R +x "$GITHUB_WORKSPACE/toolchain/bin" || true
          # Adiciona ao PATH do runner
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"
          # Debug: confirma clang no PATH e versões
          echo "=== toolchain/bin listing ==="
          ls -la "$GITHUB_WORKSPACE/toolchain/bin" | sed -n '1,200p'
          clang --version || true

      - name: Clone kernel source
        run: |
          git clone --depth 1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} kernel
          cd kernel
          if [ ! -f "arch/arm64/configs/${DEVICE_CODENAME}_defconfig" ]; then
            echo "❌ Defconfig não encontrado!"
            exit 1
          fi

      - name: Enable Ethernet drivers
        run: |
          cd kernel
          DEFCONFIG="arch/arm64/configs/${DEVICE_CODENAME}_defconfig"
          
          DRIVERS=(
            "CONFIG_USB_NET_DRIVERS=y"
            "CONFIG_USB_NET_CDCETHER=y"
            "CONFIG_USB_NET_CDC_NCM=y"
            "CONFIG_USB_NET_AX88179_178A=y"
            "CONFIG_USB_RTL8152=y"
            "CONFIG_USB_NET_RNDIS_HOST=y"
            "CONFIG_USB_USBNET=y"
          )
          
          # Limpa e injeta os drivers
          for DRV in "${DRIVERS[@]}"; do
            KEY=$(echo $DRV | cut -d'=' -f1)
            sed -i "/^${KEY}=/d" $DEFCONFIG
            sed -i "/^# ${KEY} is not set/d" $DEFCONFIG
            echo "$DRV" >> $DEFCONFIG
          done

      - name: Build kernel
        run: |
          set -euxo pipefail
          cd kernel
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"

          # Configurações LLVM nativas. Mantemos CROSS_COMPILE instalado caso seja necessário
          MAKE_ARGS="O=out ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          make $MAKE_ARGS ${DEVICE_CODENAME}_defconfig

          make -j$(nproc --all) $MAKE_ARGS

          # Procura por Image, Image.gz, Image.lz4 ou variações
          IMG=$(find out/arch/arm64/boot -type f \( -name "Image" -o -name "Image.gz" -o -name "Image.lz4" -o -name "Image*" \) | head -n 1)

          if [ -z "$IMG" ]; then
            echo "❌ Nenhuma imagem gerada!"
            ls -la out/arch/arm64/boot || true
            exit 1
          fi

          echo "IMAGE_PATH=$IMG" >> $GITHUB_ENV
          echo "✅ Imagem encontrada em: $IMG"

      - name: Collect modules
        run: |
          cd kernel
          mkdir -p modules
          find out/ -name "*.ko" -exec cp {} modules/ \;

      - name: Package with AnyKernel3
        run: |
          set -euxo pipefail
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp "kernel/$IMAGE_PATH" AnyKernel3/Image
          
          if [ -d "kernel/modules" ] && [ "$(ls -A kernel/modules)" ]; then
            mkdir -p AnyKernel3/modules/vendor/lib/modules
            cp -r kernel/modules/* AnyKernel3/modules/vendor/lib/modules/ 2>/dev/null || true
          fi
          
          echo "Bandido_Ethernet_$(date +%Y%m%d_%H%M)" > AnyKernel3/version
          cd AnyKernel3
          zip -r9 ../Bandido_Kernel_Ethernet.zip * -x .git README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bandido-Kernel-S20FE-Ethernet
          path: Bandido_Kernel_Ethernet.zip
          retention-days: 7
