name: Build Kernel Bandido (Snapdragon) with Ethernet

on:
  workflow_dispatch:

env:
  KERNEL_REPO: "https://github.com/bemerguy/bandido-sm8250.git"
  KERNEL_BRANCH: "bandido"
  DEVICE_CODENAME: "r8q"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      # ===== 1. REMOVER PACOTES CONFLITANTES =====
      - name: Remove conflicting packages
        run: |
          sudo apt update
          sudo apt remove -y gcc-multilib g++-multilib 2>/dev/null || true
          sudo apt autoremove -y
          sudo apt --fix-broken install -y

      # ===== 2. INSTALAR DEPENDÊNCIAS (sem multilib) =====
      - name: Install build dependencies
        run: |
          sudo apt install -y \
            bc bison build-essential ccache curl device-tree-compiler \
            flex git gnupg gperf libxml2-utils \
            lzop pngcrush schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libc6-dev-i386 libssl-dev \
            python3 python3-pip \
            gcc-aarch64-linux-gnu

      # ===== 3. CLANG TOOLCHAIN =====
      - name: Setup Clang
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH

      # ===== 4. CLONAR KERNEL =====
      - name: Clone kernel source
        run: |
          git clone --depth 1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} kernel
          cd kernel
          if [ ! -f "arch/arm64/configs/${DEVICE_CODENAME}_defconfig" ]; then
            echo "❌ Defconfig não encontrado!"
            exit 1
          fi
          echo "✅ Código clonado."

      # ===== 5. ATIVAR DRIVERS ETHERNET =====
      - name: Enable Ethernet drivers
        run: |
          cd kernel
          DEFCONFIG="arch/arm64/configs/${DEVICE_CODENAME}_defconfig"
          DRIVERS=(
            "CONFIG_USB_NET_CDCETHER=y"
            "CONFIG_USB_NET_CDC_NCM=y"
            "CONFIG_USB_NET_AX88179=y"
            "CONFIG_USB_RTL8152=y"
            "CONFIG_USB_NET_RNDIS_HOST=y"
            "CONFIG_USB_USBNET=y"
          )
          for DRV in "${DRIVERS[@]}"; do
            KEY=$(echo $DRV | cut -d'=' -f1)
            sed -i "/^${KEY}=/d" $DEFCONFIG
            sed -i "/^# ${KEY} is not set/d" $DEFCONFIG
            echo "$DRV" >> $DEFCONFIG
          done
          echo "✅ Drivers Ethernet ativados."

      # ===== 6. COMPILAR KERNEL =====
      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          if [ -f "build.sh" ]; then
            chmod +x build.sh
            ./build.sh
          else
            make ${DEVICE_CODENAME}_defconfig
            make -j$(nproc --all)
          fi

          IMG=""
          for path in "arch/arm64/boot/Image" "arch/arm64/boot/Image.gz-dtb" "out/arch/arm64/boot/Image" "out/arch/arm64/boot/Image.gz-dtb"; do
            if [ -f "$path" ]; then
              IMG="$path"
              break
            fi
          done
          if [ -z "$IMG" ]; then
            echo "❌ Nenhuma imagem gerada!"
            exit 1
          fi
          echo "IMAGE_PATH=$IMG" >> $GITHUB_ENV
          echo "✅ Kernel compilado: $IMG"

      # ===== 7. COLETAR MÓDULOS =====
      - name: Collect modules
        run: |
          cd kernel
          mkdir -p modules
          find . -name "*.ko" -exec cp {} modules/ \;
          if [ "$(ls -A modules 2>/dev/null)" ]; then
            echo "✅ Módulos encontrados."
          else
            echo "⚠️ Nenhum módulo .ko."
          fi

      # ===== 8. EMPACOTAR COM AnyKernel3 =====
      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp kernel/$IMAGE_PATH AnyKernel3/Image
          if [ -d "kernel/modules" ] && [ "$(ls -A kernel/modules)" ]; then
            cp -r kernel/modules/* AnyKernel3/modules/ 2>/dev/null || true
          fi
          echo "Bandido_Ethernet_$(date +%Y%m%d_%H%M)" > AnyKernel3/version
          cd AnyKernel3
          zip -r9 ../Bandido_Kernel_Ethernet.zip * -x .git README.md
          echo "✅ ZIP criado."

      # ===== 9. UPLOAD =====
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bandido-Kernel-S20FE-Ethernet
          path: Bandido_Kernel_Ethernet.zip
          retention-days: 7
